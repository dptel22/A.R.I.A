services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        BASE_IMAGE: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime

    environment:
      ARIA_INFERENCE_DEVICE: "0"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
