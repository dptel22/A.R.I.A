name: aria

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - aria_runtime:/app/runtime
      - aria_models:/app/models
    networks:
      - aria-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      ARIA_API_KEY: "${ARIA_API_KEY}"
      NGINX_ENVSUBST_FILTER: "^ARIA_API_KEY$"
    ports:
      - "3000:80"
    networks:
      - aria-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  aria-net:
    driver: bridge

volumes:
  aria_runtime:
  aria_models:
