[project]
name = "aria"
version = "1.0.0"
description = "Automated Road Inspection & Accountability"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "ultralytics>=8.3.0",
    "opencv-python>=4.6.0",
    "reportlab>=4.4.0",
    "pymupdf>=1.24.0",
    "google-genai>=1.0.0",
    "sqlite-vec>=0.1.6",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "requests>=2.32.0",
    "Pillow>=11.0.0",
    "numpy>=2.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false
